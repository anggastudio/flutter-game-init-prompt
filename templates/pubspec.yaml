# Dependency set for a monetized Flutter mobile game.
#
# Rename the package, then delete whichever renderer you are not using: `flame`
# for sprite and physics games, nothing at all for geometric boards drawn with
# a CustomPainter. Everything else is load-bearing.

name: game_name
description: "<< One sentence. This shows up in nothing user-facing, but future you will read it. >>"
publish_to: 'none'

# The source of truth for the store build. Bump the build number (the part
# after +) on every upload; Play rejects a duplicate versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Rendering. Drop this for a CustomPainter game.
  flame: ^1.37.0

  # State and navigation. go_router only earns its place past three screens.
  flutter_riverpod: ^3.3.2
  go_router: ^17.4.0

  # Monetization
  google_mobile_ads: ^9.0.0
  purchases_flutter: ^10.8.0

  # iOS App Tracking Transparency, required before serving personalised ads.
  app_tracking_transparency: ^2.0.7

  # Observability
  sentry_flutter: ^9.26.0

  # Configuration and storage
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5

  # Presentation
  audioplayers: ^6.8.1
  google_fonts: ^8.2.1

  # Annotations only. Lets the pure-Dart engine mark its test hooks without
  # importing Flutter, which would make it untestable on the plain Dart VM.
  meta: ^1.18.0

  # Uncomment when you need them.
  # package_info_plus: ^10.2.0   # release name for Sentry, version in settings
  # url_launcher: ^6.3.2         # privacy policy, store review link
  # vibration: ^3.2.0            # haptics beyond HapticFeedback
  # intl: any                    # number and date formatting
  # flutter_localizations:
  #   sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Uncomment if the app is localised. Config goes in l10n.yaml.
  # generate: true

  assets:
    # Runtime configuration. Never commit the real .env; see .env.example.
    - .env
    - assets/audio/
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D0000"
  image: assets/icon/splash.png
  android_12:
    color: "#0D0000"
    image: assets/icon/splash.png
  fullscreen: true
