# Static analysis configuration. Run with `flutter analyze`.
#
# See https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Build output. On iOS this contains the vendored sources of Swift Package
    # Manager dependencies, including their own test files, which would
    # otherwise flood the report with hundreds of errors from code we do not
    # own and cannot fix.
    - build/**
    - .dart_tool/**
    # Generated by flutter_native_splash and flutter_launcher_icons.
    - "**/*.g.dart"

  errors:
    # Missing documentation on a public API is worth knowing about but should
    # not fail a build.
    public_member_api_docs: ignore

linter:
  rules:
    # A game engine deals in exact arithmetic, so an accidental integer
    # division that silently truncates is a real bug source.
    - avoid_slow_async_io
    - prefer_final_locals
    # Ads and purchases fire a lot of fire-and-forget futures. Forcing an
    # explicit `unawaited()` makes each one a decision rather than an oversight.
    - unawaited_futures
    # Widget trees get deep; const constructors keep rebuilds cheap.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # Value types in the engine are compared constantly.
    - avoid_equals_and_hash_code_on_mutable_classes
